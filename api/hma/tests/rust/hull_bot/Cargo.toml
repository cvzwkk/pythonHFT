[package]
name = "hull_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = "0.15"
axum = "0.7"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
